<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>塔罗牌抽取</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0a0a0a;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }
  .title {
    font-size: 20px;
    font-weight: 500;
    margin-bottom: 8px;
    letter-spacing: 2px;
    text-align: center;
  }
  .question-display {
    font-size: 14px;
    color: #aaa;
    margin-bottom: 24px;
    text-align: center;
    max-width: 600px;
    line-height: 1.6;
    min-height: 22px;
    font-style: italic;
  }
  .draw-btn {
    background: #fff;
    color: #0a0a0a;
    border: none;
    padding: 12px 40px;
    font-size: 16px;
    font-weight: 500;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-bottom: 36px;
    letter-spacing: 1px;
  }
  .draw-btn:hover { background: #e0e0e0; transform: translateY(-1px); }
  .draw-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .cards-area {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
    margin-bottom: 28px;
    min-height: 240px;
    align-items: flex-start;
  }
  .card-slot { width: 150px; perspective: 800px; }
  .card-inner {
    width: 150px; height: 240px;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    border-radius: 10px;
  }
  .card-inner.flipped { transform: rotateY(180deg); }
  .card-inner.reversed { transform: rotateY(180deg) rotate(180deg); }
  .card-front, .card-back {
    position: absolute; width: 100%; height: 100%;
    backface-visibility: hidden;
    border-radius: 10px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .card-back {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    border: 2px solid #333;
  }
  .card-back::before {
    content: "✦"; font-size: 52px; color: rgba(255,255,255,0.15);
  }
  .card-back::after {
    content: ""; position: absolute; inset: 8px;
    border: 1px solid rgba(255,255,255,0.1); border-radius: 6px;
  }
  .card-front {
    background: #fff; color: #0a0a0a;
    transform: rotateY(180deg);
    padding: 14px; border: 2px solid #ddd;
    position: relative;
  }
  .card-front .card-name {
    font-size: 13px; font-weight: 500;
    text-align: center; line-height: 1.4; margin-bottom: 4px;
  }
  .card-front .card-orientation {
    font-size: 11px; margin-bottom: 8px;
  }
  .card-front .card-icon { font-size: 36px; margin-bottom: 8px; }
  .card-front .card-num {
    font-size: 10px; color: #999;
    position: absolute; top: 6px; left: 8px;
  }
  .card-front .card-num-bottom {
    font-size: 10px; color: #999;
    position: absolute; bottom: 6px; right: 8px;
    transform: rotate(180deg);
  }
  .slot-label {
    font-size: 11px; color: #666;
    margin-top: 10px; text-align: center; letter-spacing: 1px;
  }
  .meanings-area {
    display: flex; justify-content: center;
    gap: 20px; flex-wrap: wrap; max-width: 900px;
    margin-bottom: 28px;
  }
  .meaning-box {
    width: 260px;
    background: rgba(255,255,255,0.05);
    border-radius: 10px;
    padding: 16px;
    text-align: left;
    border: 1px solid rgba(255,255,255,0.08);
    opacity: 0;
    transform: translateY(12px);
    transition: all 0.5s ease;
  }
  .meaning-box.show { opacity: 1; transform: translateY(0); }
  .meaning-box .m-title { font-size: 14px; font-weight: 500; margin-bottom: 6px; }
  .meaning-box .m-orient {
    font-size: 11px; margin-bottom: 8px;
    padding: 2px 10px; border-radius: 4px;
    display: inline-block; background: rgba(255,255,255,0.08);
  }
  .meaning-box .m-text { font-size: 13px; color: #ccc; line-height: 1.7; }

  .summary-area {
    max-width: 820px;
    width: 100%;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 24px 28px;
    text-align: center;
    opacity: 0;
    transform: translateY(16px);
    transition: all 0.7s ease;
  }
  .summary-area.show { opacity: 1; transform: translateY(0); }
  .summary-area .summary-title {
    font-size: 15px;
    font-weight: 500;
    color: #fff;
    margin-bottom: 12px;
    letter-spacing: 2px;
  }
  .summary-area .summary-text {
    font-size: 14px;
    color: #bbb;
    line-height: 1.9;
    text-align: left;
  }
  .summary-area .summary-divider {
    width: 40px;
    height: 1px;
    background: rgba(255,255,255,0.2);
    margin: 0 auto 16px auto;
  }

  /* 弹窗样式 */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }
  .modal-overlay.active {
    opacity: 1;
    pointer-events: all;
  }
  .modal-box {
    background: #141414;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px;
    padding: 32px 28px;
    width: 90%;
    max-width: 460px;
    text-align: center;
    transform: translateY(20px) scale(0.96);
    transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .modal-overlay.active .modal-box {
    transform: translateY(0) scale(1);
  }
  .modal-box .modal-title {
    font-size: 18px;
    font-weight: 500;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }
  .modal-box .modal-sub {
    font-size: 13px;
    color: #888;
    margin-bottom: 20px;
  }
  .modal-box textarea {
    width: 100%;
    background: #1e1e1e;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    padding: 14px;
    color: #fff;
    font-size: 14px;
    font-family: inherit;
    resize: none;
    outline: none;
    line-height: 1.6;
    margin-bottom: 16px;
    transition: border-color 0.3s;
  }
  .modal-box textarea:focus {
    border-color: rgba(255,255,255,0.3);
  }
  .modal-box textarea::placeholder {
    color: #555;
  }
  .modal-box .modal-btn {
    background: #fff;
    color: #0a0a0a;
    border: none;
    padding: 11px 36px;
    font-size: 15px;
    font-weight: 500;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s;
    letter-spacing: 1px;
  }
  .modal-box .modal-btn:hover { background: #e0e0e0; }
  .modal-box .modal-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .modal-box .modal-skip {
    font-size: 12px;
    color: #666;
    margin-top: 12px;
    cursor: pointer;
    background: none;
    border: none;
    font-family: inherit;
  }
  .modal-box .modal-skip:hover { color: #aaa; }

  @keyframes shuffle {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-10px) rotate(-4deg); }
    75% { transform: translateX(10px) rotate(4deg); }
  }
  .shuffling .card-inner { animation: shuffle 0.3s ease 3; }
</style>
</head>
<body>

  <!-- 问题弹窗 -->
  <div class="modal-overlay active" id="questionModal">
    <div class="modal-box">
      <div class="modal-title">✦ 塔罗指引 ✦</div>
      <div class="modal-sub">在抽取之前，请先在心中聚焦你的问题</div>
      <textarea id="questionInput" rows="3" placeholder="例如：我和TA的感情未来会如何发展？&#10;例如：我目前的工作方向是否正确？"></textarea>
      <button class="modal-btn" id="confirmQuestion" onclick="submitQuestion()">确认问题，开始抽牌</button>
      <div><button class="modal-skip" onclick="skipQuestion()">跳过，直接抽牌</button></div>
    </div>
  </div>

  <div class="title">在心中默念你的问题，抽取塔罗吧</div>
  <div class="question-display" id="questionDisplay"></div>
  <button class="draw-btn" id="drawBtn" onclick="drawCards()">抽取塔罗牌</button>

  <div class="cards-area" id="cardsArea">
    <div class="card-slot">
      <div class="card-inner" id="card0">
        <div class="card-back"></div>
        <div class="card-front"></div>
      </div>
      <div class="slot-label">过去</div>
    </div>
    <div class="card-slot">
      <div class="card-inner" id="card1">
        <div class="card-back"></div>
        <div class="card-front"></div>
      </div>
      <div class="slot-label">现在</div>
    </div>
    <div class="card-slot">
      <div class="card-inner" id="card2">
        <div class="card-back"></div>
        <div class="card-front"></div>
      </div>
      <div class="slot-label">未来</div>
    </div>
  </div>

  <div class="meanings-area" id="meaningsArea"></div>
  <div class="summary-area" id="summaryArea"></div>

  {name:"星币骑士", upright:"稳定、踏实、坚持、可靠", reversed:"停滞、固执、效率低"},
  {name:"星币王后", upright:"务实、独立、照顾、稳定、财富", reversed:"过度操心、物质主义、不安全感"},
  {name:"星币国王", upright:"财富、事业、稳定、成熟、成功", reversed:"贪婪、物质至上、控制欲"}
];

function getSuitIcon(name) {
  if (name.includes("权杖")) return "🔥";
  if (name.includes("圣杯")) return "🌊";
  if (name.includes("宝剑")) return "⚔️";
  if (name.includes("星币")) return "💰";
  return "🌟";
}

function getSuitType(name) {
  if (name.includes("权杖")) return "wands";
  if (name.includes("圣杯")) return "cups";
  if (name.includes("宝剑")) return "swords";
  if (name.includes("星币")) return "pentacles";
  return "major";
}

function getQuestionTheme(q) {
  const text = q.toLowerCase();
  if (/感情|爱情|恋爱|分手|复合|桃花|暧昧|喜欢|他|她|对象|伴侣|结婚|婚姻|出轨|前任/.test(text)) return "love";
  if (/工作|事业|职场|升职|跳槽|创业|项目|老板|同事|面试|offer|薪资|辞职|转行/.test(text)) return "career";
  if (/学业|考试|学习|考研|留学|录取|成绩|学校|专业|论文|毕业/.test(text)) return "study";
  if (/钱|财|投资|理财|债务|收入|支出|买房|经济|生意|亏损|赚钱/.test(text)) return "money";
  if (/健康|身体|病|医院|手术|恢复|养生|失眠|焦虑|抑郁|心理/.test(text)) return "health";
  if (/搬家|旅行|出国|迁移|城市|环境|换地方/.test(text)) return "travel";
  if (/选择|决定|方向|迷茫|困惑|不知道|怎么办|建议/.test(text)) return "decision";
  return "general";
}

function submitQuestion() {
  const input = document.getElementById('questionInput');
  const val = input.value.trim();
  if (!val) {
    input.style.borderColor = "#c44";
    setTimeout(() => input.style.borderColor = "", 800);
    return;
  }
  currentQuestion = val;
  document.getElementById('questionDisplay').textContent = "「" + val + "」";
  document.getElementById('questionModal').classList.remove('active');
}

function skipQuestion() {
  currentQuestion = "";
  document.getElementById('questionDisplay').textContent = "";
  document.getElementById('questionModal').classList.remove('active');
}

function generateSummary(cards) {
  const reversedCount = cards.filter(c => c.isReversed).length;
  const suits = cards.map(c => getSuitType(c.name));
  const hasMajor = suits.includes("major");
  const suitCounts = {};
  suits.forEach(s => suitCounts[s] = (suitCounts[s] || 0) + 1);
  const dominantSuit = Object.entries(suitCounts).sort((a,b) => b[1]-a[1])[0][0];
  const theme = getQuestionTheme(currentQuestion);

  let summary = "";

  // 问题引导语
  if (currentQuestion) {
    summary += "针对你提出的「" + currentQuestion + "」，牌阵给出了这样的回应：\n\n";
  }

  // 整体基调
  if (reversedCount === 0) {
    summary += "【整体能量】三张牌皆为正位，整体能量流通顺畅。";
  } else if (reversedCount === 1) {
    summary += "【整体能量】两张正位与一张逆位交织，整体趋势向好，但其中存在一处需要你特别留意的卡点。";
  } else if (reversedCount === 2) {
    summary += "【整体能量】两张逆位提示当前并非一帆风顺，你可能正处于调整与适应的阶段，需要更多耐心与觉察。";
  } else {
    summary += "【整体能量】三张逆位同时出现，这并非坏兆头，而是宇宙在强烈提示你：某些旧有的模式需要被看见、被释放。转变往往始于最深的触动。";
  }

  summary += "\n\n";

  // 时间线解读
  const past = cards[0];
  const present = cards[1];
  const future = cards[2];
  const pastName = past.name.split(" ").slice(0,2).join(" ");
  const presentName = present.name.split(" ").slice(0,2).join(" ");
  const futureName = future.name.split(" ").slice(0,2).join(" ");

  summary += "【时间之流】\n";
  summary += "「过去」的「" + pastName + "」" + (past.isReversed ? "逆位" : "正位") + "揭示了你走到今日的根源与底色；";
  summary += "「现在」的「" + presentName + "」" + (present.isReversed ? "逆位" : "正位") + "是你此刻需要面对与整合的核心能量；";
  summary += "「未来」的「" + futureName + "」" + (future.isReversed ? "逆位" : "正位") + "则预示了前路的方向与可能。";

  summary += "\n\n";

  // 主题针对性解读
  summary += "【针对你的问题】\n";
  const pastMean = past.isReversed ? past.reversed : past.upright;
  const presMean = present.isReversed ? present.reversed : present.upright;
  const futMean = future.isReversed ? future.reversed : future.upright;

  if (theme === "love") {
    summary += "在感情层面，过去之「" + pastName + "」暗示这段关系的起点或历史背景带有" + pastMean.split("、").slice(0,2).join("、") + "的特质；";
    summary += "现在之「" + presentName + "」提示你当下最需要觉察的是" + presMean.split("、").slice(0,2).join("、") + "；";
    summary += "未来之「" + futureName + "」则指向关系发展的趋势——" + futMean.split("、").slice(0,2).join("、") + "将成为关键。";
    if (cards.some(c => c.name.includes("恋人") || c.name.includes("圣杯2"))) {
      summary += "牌面中出现了强烈的「联结」与「契合」能量，真诚沟通将是打开局面的钥匙。";
    }
    if (cards.some(c => c.name.includes("死神") || c.name.includes("高塔"))) {
      summary += "值得注意的是，牌面带有「结束与重构」的讯息。有些关系需要被彻底放下，才能为新的可能腾出空间。";
    }
  } else if (theme === "career") {
    summary += "在事业层面，过去之「" + pastName + "」反映了你职业路径上的积累或转折带有" + pastMean.split("、").slice(0,2).join("、") + "的色彩；";
    summary += "现在之「" + presentName + "」提示你当前职场状态的核心关键词是" + presMean.split("、").slice(0,2).join("、") + "；";
    summary += "未来之「" + futureName + "」预示下一阶段的发展方向将围绕" + futMean.split("、").slice(0,2).join("、") + "展开。";
    if (cards.some(c => c.name.includes("战车") || c.name.includes("权杖6"))) {
      summary += "行动与突破的能量很强，现在不是犹豫的时候。";
    }
    if (cards.some(c => c.name.includes("宝剑2") || c.name.includes("倒吊人"))) {
      summary += "牌面提示你或许需要换个角度审视现状，僵化的思路会限制你的选择。";
    }
  } else if (theme === "study") {
    summary += "在学业层面，过去之「" + pastName + "」反映了你学习历程中" + pastMean.split("、").slice(0,2).join("、") + "的经历；";
    summary += "现在之「" + presentName + "」提示你当前学习状态的核心在于" + presMean.split("、").slice(0,2).join("、") + "；";
    summary += "未来之「" + futureName + "」则预示了学业发展的走向——" + futMean.split("、").slice(0,2).join("、") + "将是关键。";
    if (cards.some(c => c.name.includes("魔术师") || c.name.includes("星币8"))) {
      summary += "你的能力与专注力正在被牌面肯定，持续投入会有回报。";
    }
  } else if (theme === "money") {
    summary += "在财务层面，过去之「" + pastName + "」揭示了你金钱观念或财务状况中" + pastMean.split("、").slice(0,2).join("、") + "的模式；";
    summary += "现在之「" + presentName + "」提示你当前财务状态的核心在于" + presMean.split("、").slice(0,2).join("、") + "；";
    summary += "未来之「" + futureName + "」则预示了财务走向——" + futMean.split("、").slice(0,2).join("、") + "将成为主题。";
    if (cards.some(c => c.name.includes("恶魔") || c.name.includes("星币4"))) {
      summary += "注意不要被物质欲望过度牵引，健康的财务观需要平衡。";
    }
  } else if (theme === "health") {
    summary += "在健康层面，过去之「" + pastName + "」反映了你身体或心理状态中" + pastMean.split("、").slice(0,2).join("、") + "的积累；";
    summary += "现在之「" + presentName + "」提示你当前最需要关注的是" + presMean.split("、").slice(0,2).join("、") + "；";
    summary += "未来之「" + futureName + "」则预示了恢复或转变的方向——" + futMean.split("、").slice(0,2).join("、") + "将是关键。";
    if (cards.some(c => c.name.includes("星星") || c.name.includes("太阳"))) {
      summary += "疗愈与希望的能量很强，保持信心对身体恢复有积极作用。";
    }
  } else if (theme === "travel") {
    summary += "在迁移/出行层面，过去之「" + pastName + "」反映了你与地点、环境相关的" + pastMean.split("、").slice(0,2).join("、") + "经历；";
    summary += "现在之「" + presentName + "」提示你当前关于变动的核心在于" + presMean.split("、").slice(0,2).join("、") + "；";
    summary += "未来之「" + futureName + "」则预示了变动结果——" + futMean.split("、").slice(0,2).join("、") + "将成为主题。";
  } else if (theme === "decision") {
    summary += "关于你的抉择，过去之「" + pastName + "」揭示了你走到这个十字路口的根源在于" + pastMean.split("、").slice(0,2).join("、") + "；";
    summary += "现在之「" + presentName + "」提示你当下最需要觉察的是" + presMean.split("、").slice(0,2).join("、") + "；";
    summary += "未来之「" + futureName + "」则指向选择后的走向——" + futMean.split("、").slice(0,2).join("、") + "将是结果。";
    if (cards.some(c => c.name.includes("正义") || c.name.includes("女祭司"))) {
      summary += "直觉与理性的平衡是此刻最需要的。不要只凭冲动，也不要过度分析。";
    }
  } else {
    summary += "过去之「" + pastName + "」奠定了你走到今日的根基，带有" + pastMean.split("、").slice(0,2).join("、") + "的特质；";
    summary += "现在之「" + presentName + "」是你此刻需要面对与整合的核心能量——" + presMean.split("、").slice(0,2).join("、") + "；";
    summary += "未来之「" + futureName + "」则揭示了前路的方向，" + futMean.split("、").slice(0,2).join("、") + "将成为关键。";
  }

  summary += "\n\n";

  // 元素/牌组主题
  const suitNames = {wands:"权杖（火）", cups:"圣杯（水）", swords:"宝剑（风）", pentacles:"星币（土）", major:"大阿卡纳"};
  if (dominantSuit !== "major" && suitCounts[dominantSuit] >= 2) {
    summary += "【元素启示】" + suitNames[dominantSuit] + "元素在此牌阵中占据主导，提示你当前的核心课题与";
    if (dominantSuit === "wands") summary += "行动力、热情与创造力";
    if (dominantSuit === "cups") summary += "情感、关系与内心世界";
    if (dominantSuit === "swords") summary += "思维、沟通与真相的厘清";
    if (dominantSuit === "pentacles") summary += "物质、现实基础与长期积累";
    summary += "密切相关。";
  } else if (hasMajor) {
    summary += "【深层指引】大阿卡纳的出现意味着这不仅仅是一个日常的小问题，而是关乎你灵魂成长的重要课题。请认真对待这份来自更高维度的讯息。";
  }

  summary += "\n\n";

  // 行动建议
  summary += "【给你的话】\n";
  const adviceList = [
    "塔罗从不预言固定的命运，它映照的是你当下的能量场。真正的力量始终在你手中。",
    "无论牌面如何，请记住：逆位不是惩罚，正位也不是保证。它们都是让你更了解自己的镜子。",
    "当你感到迷茫时，回到呼吸，回到身体，回到此刻。答案往往不在远方，而在你之内。",
    "这三张牌是一个故事，而你是这个故事的书写者。相信直觉，也相信行动。",
    "牌面的讯息会在未来数周甚至数月里逐渐显现。保持开放，保持觉察。"
  ];
  summary += adviceList[Math.floor(Math.random() * adviceList.length)];

  return summary;
}

function drawCards() {
  const btn = document.getElementById('drawBtn');
  const meaningsArea = document.getElementById('meaningsArea');
  const summaryArea = document.getElementById('summaryArea');
  btn.disabled = true;
  btn.textContent = "洗牌中...";
  meaningsArea.innerHTML = '';
  summaryArea.innerHTML = '';
  summaryArea.classList.remove('show');

  for (let i = 0; i < 3; i++) {
    const card = document.getElementById('card' + i);
    card.className = 'card-inner';
    card.querySelector('.card-front').innerHTML = '';
  }

  document.getElementById('cardsArea').classList.add('shuffling');

  setTimeout(() => {
    document.getElementById('cardsArea').classList.remove('shuffling');

    const indices = [];
    while (indices.length < 3) {
      const r = Math.floor(Math.random() * tarotData.length);
      if (!indices.includes(r)) indices.push(r);
    }

    const results = indices.map(idx => {
      const isReversed = Math.random() < 0.5;
      return { ...tarotData[idx], isReversed };
    });

    results.forEach((cardData, i) => {
      setTimeout(() => {
        const cardEl = document.getElementById('card' + i);
        const front = cardEl.querySelector('.card-front');
        const icon = getSuitIcon(cardData.name);
        const num = cardData.name.match(/^(\d+|\w+\d+|\w+侍者|\w+骑士|\w+王后|\w+国王)/)?.[0] || '';
        const orient = cardData.isReversed ? "逆位" : "正位";
        const orientColor = cardData.isReversed ? "#c44" : "#2a8";

        front.innerHTML = `
          <span class="card-num">${num}</span>
          <div class="card-icon">${icon}</div>
          <div class="card-name">${cardData.name}</div>
          <div class="card-orientation" style="color:${orientColor};font-weight:500;">${orient}</div>
          <span class="card-num-bottom">${num}</span>
        `;

        if (cardData.isReversed) cardEl.classList.add('reversed');
        else cardEl.classList.add('flipped');
      }, i * 400);
    });

    setTimeout(() => {
      results.forEach((cardData, i) => {
        const meaning = cardData.isReversed ? cardData.reversed : cardData.upright;
        const orient = cardData.isReversed ? "逆位" : "正位";
        const orientColor = cardData.isReversed ? "#c44" : "#2a8";

        const box = document.createElement('div');
        box.className = 'meaning-box';
        box.innerHTML = `
          <div class="m-title">${cardData.name}</div>
          <div class="m-orient" style="color:${orientColor};">${orient}</div>
          <div class="m-text">${meaning}</div>
        `;
        meaningsArea.appendChild(box);
        setTimeout(() => box.classList.add('show'), i * 200);
      });

      setTimeout(() => {
        const summaryText = generateSummary(results);
        summaryArea.innerHTML = `
          <div class="summary-title">✦ 牌阵总结 ✦</div>
          <div class="summary-divider"></div>
          <div class="summary-text">${summaryText.replace(/\n/g, '<br>')}</div>
        `;
        summaryArea.classList.add('show');
      }, 600);

      btn.disabled = false;
      btn.textContent = "再次抽取";
    }, 3 * 400 + 500);

  }, 900);
}
</script>
